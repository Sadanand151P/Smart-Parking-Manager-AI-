<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — SmartPark India</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container auth-shell">
  <div class="card">
    <div id="stepRegister">
      <div class="eyebrow">CREATE ACCOUNT</div>
      <h2>Join SmartPark India</h2>
      <form id="registerForm" class="mt-24">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" required placeholder="Aditi Sharma">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="mobile">Mobile number (India)</label>
          <input type="text" id="mobile" required placeholder="9XXXXXXXXX" maxlength="10">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="role">I am a</label>
          <select id="role">
            <option value="customer">Customer — looking for parking</option>
            <option value="owner">Parking Owner — listing a facility</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register &amp; Send OTP</button>
      </form>
      <p class="muted mt-16" style="font-size:13px;">
        Already have an account? <a href="login.html" style="color:var(--asphalt);font-weight:600;">Log in</a>
      </p>
    </div>

    <div id="stepOtp" style="display:none;">
      <div class="eyebrow">VERIFY MOBILE</div>
      <h2>Enter the OTP</h2>
      <p class="muted mt-8" style="font-size:14px;">We've sent a 6-digit code to your mobile number (SMS is mocked in this dev build — see the code note below).</p>
      <form id="otpForm" class="mt-24">
        <div class="form-group">
          <label for="otp">OTP</label>
          <input type="text" id="otp" required maxlength="6" placeholder="123456" class="mono" style="font-size:20px;letter-spacing:0.3em;text-align:center;">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verify &amp; Continue</button>
      </form>
      <p id="debugOtpNote" class="muted mt-16" style="font-size:12px;"></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
renderNavbar();
let registeredMobile = null;

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    mobile: document.getElementById("mobile").value.trim(),
    password: document.getElementById("password").value,
    role: document.getElementById("role").value,
  };
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Registering…";
  try {
    const data = await api("/auth/register", { method: "POST", auth: false, body });
    registeredMobile = body.mobile;
    document.getElementById("stepRegister").style.display = "none";
    document.getElementById("stepOtp").style.display = "block";
    if (data.debug_otp) {
      document.getElementById("debugOtpNote").textContent = `[DEV MODE] Your OTP is ${data.debug_otp} — MSG91 isn't configured, so it's shown here instead of sent by SMS.`;
    }
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = "Register & Send OTP";
  }
});

document.getElementById("otpForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const otp = document.getElementById("otp").value.trim();
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Verifying…";
  try {
    const data = await api("/auth/verify-otp", { method: "POST", auth: false, body: { mobile: registeredMobile, otp, purpose: "register" } });
    setToken(data.token);
    toast("Mobile verified! Please log in to continue.");
    setTimeout(() => window.location.href = "login.html", 800);
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false; btn.textContent = "Verify & Continue";
  }
});
</script>
</body>
</html>
